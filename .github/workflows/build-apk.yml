name: Build CatStretchHelper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto
        run: |
          mkdir extracted
          unzip -q CatStretchHelper-source-v2.zip -d extracted
      - name: Corrigir integração Shizuku
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('extracted/CatStretchHelper/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          s = manifest.read_text()
          provider = '        <provider android:name="rikka.shizuku.ShizukuProvider" android:authorities="${applicationId}.shizuku" android:multiprocess="false" android:enabled="true" android:exported="true" android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />\n'
          if 'rikka.shizuku.ShizukuProvider' not in s:
              s = s.replace('    </application>', provider + '    </application>')
          manifest.write_text(s)
          p = root / 'java/com/alison/catstretch/ProjectionUserService.java'
          s = p.read_text()
          old = 'public final class ProjectionUserService extends IProjectionService.Stub {'
          new = 'public final class ProjectionUserService extends android.app.Service {\n    private final IProjectionService.Stub binder = new IProjectionService.Stub() {\n        @Override public String applyStretch(int rotation, int sw, int sh, int tw, int th) { return ProjectionUserService.this.applyStretch(rotation, sw, sh, tw, th); }\n        @Override public String resetProjection(int rotation) { return ProjectionUserService.this.resetProjection(rotation); }\n    };\n    @Override public IBinder onBind(android.content.Intent intent) { return binder; }'
          if old not in s:
              raise SystemExit('Declaração da classe não encontrada; arquivo não foi alterado')
          s = s.replace(old, new, 1)
          s = s.replace('    @Override\n    public String applyStretch(', '    public String applyStretch(', 1)
          s = s.replace('    @Override\n    public String resetProjection(', '    public String resetProjection(', 1)
          p.write_text(s)
          gradle = Path('extracted/CatStretchHelper/app/build.gradle')
          g = gradle.read_text()
          marker = 'android {\n'
          if marker not in g:
              raise SystemExit('Bloco android não encontrado')
          if 'buildFeatures {' not in g:
              g = g.replace(marker, marker + '    buildFeatures {\n        aidl true\n        buildConfig true\n    }\n', 1)
          gradle.write_text(g)
          print('Correções aplicadas')
          PY
      - name: Compilar APK
        run: gradle -p extracted/CatStretchHelper :app:assembleDebug
      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CatStretchHelper-debug-apk
          path: extracted/CatStretchHelper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
